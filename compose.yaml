name: ${COMPOSE_PROJECT_NAME:-hostflow}

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydatabase}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-verysecret}
      MYSQL_USER: ${MYSQL_USER:-myuser}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=root --execute='SELECT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_only_change_me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only_change_me}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    profiles:
      - development
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${IP_ADDRESS:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025"
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        JAVA_BUILD_IMAGE: ${JAVA_BUILD_IMAGE:-eclipse-temurin:21-jdk-alpine}
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8080}:8080"
    environment:
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-delta_tigre}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-mydatabase}?${MYSQL_JDBC_PARAMS:-useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true}"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-myuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-secret}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only_change_me}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-false}
      SPRING_MAIL_CONNECTION_TIMEOUT: ${SPRING_MAIL_CONNECTION_TIMEOUT:-5000}
      SPRING_MAIL_TIMEOUT: ${SPRING_MAIL_TIMEOUT:-5000}
      SPRING_MAIL_WRITETIMEOUT: ${SPRING_MAIL_WRITETIMEOUT:-500
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BOAT_WEBHOOK_URL: ${BOAT_WEBHOOK_URL:-}
      JWT_SECRET: ${JWT_SECRET:-hostflow-dev-only-jwt-secret-change-before-deployment-2026}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${IP_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: vscode
    working_dir: /workspaces/hostflow
    command: ["sleep", "infinity"]
    environment:
      TEST_SPRING_DATASOURCE_URL: ${TEST_SPRING_DATASOURCE_URL:-jdbc:h2:mem:delta_tigre;MODE=MySQL;DB_CLOSE_DELAY=-1}
      TEST_SPRING_DATASOURCE_USERNAME: ${TEST_SPRING_DATASOURCE_USERNAME:-sa}
      TEST_SPRING_DATASOURCE_PASSWORD: ${TEST_SPRING_DATASOURCE_PASSWORD:-}
      TEST_SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${TEST_SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.h2.Driver}
      TEST_JWT_SECRET: ${TEST_JWT_SECRET:-test-secret-hostflow-con-mas-de-32-caracteres-123}
      TEST_JWT_EXPIRATION_MINUTES: ${TEST_JWT_EXPIRATION_MINUTES:-60}
      TEST_CORS_ALLOWED_ORIGINS: ${TEST_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - .:/workspaces/hostflow:cached
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network
    profiles:
      - development

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge
